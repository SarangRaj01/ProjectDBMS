<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Distributed Inventory and Order Consistency System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#ff7b72;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#ff7b72;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff7b72">
        <animate attributeName="stop-color" values="#ff7b72;#58a6ff;#bc8cff;#ff7b72" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- nebula glows -->
    <circle cx="180" cy="90" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="330" r="280" fill="url(#glowB)">
      <animate attributeName="cx" values="1020;940;1020" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="330" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="360" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="52" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="70" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="250" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="240" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="120" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="370" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- network: warehouses linked to the core -->
    <g fill="none" stroke-width="1.6" stroke-linecap="round">
      <path d="M130 120 L330 200" stroke="#58a6ff" stroke-opacity="0.55" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M110 300 L330 210" stroke="#bc8cff" stroke-opacity="0.55" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M1070 110 L870 195" stroke="#ff7b72" stroke-opacity="0.55" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="56" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M1090 305 L870 215" stroke="#3fb950" stroke-opacity="0.55" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="56" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- warehouse nodes -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">
      <g filter="url(#glow)">
        <rect x="80" y="96" width="100" height="48" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <rect x="60" y="276" width="100" height="48" rx="10" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5"/>
        <rect x="1020" y="86" width="100" height="48" rx="10" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
        <rect x="1040" y="281" width="100" height="48" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      </g>
      <text x="130" y="116" fill="#58a6ff" font-weight="700">WAREHOUSE</text>
      <text x="130" y="133" fill="#8b949e">stock: 1,240</text>
      <text x="110" y="296" fill="#bc8cff" font-weight="700">WAREHOUSE</text>
      <text x="110" y="313" fill="#8b949e">stock: 860</text>
      <text x="1070" y="106" fill="#ff7b72" font-weight="700">WAREHOUSE</text>
      <text x="1070" y="123" fill="#8b949e">stock: 395</text>
      <text x="1090" y="301" fill="#3fb950" font-weight="700">WAREHOUSE</text>
      <text x="1090" y="318" fill="#8b949e">stock: 2,110</text>
    </g>

    <!-- central core -->
    <g transform="translate(600 200)">
      <circle r="150" fill="none" stroke="#58a6ff" stroke-opacity="0.12" stroke-width="1"/>
      <circle r="190" fill="none" stroke="#bc8cff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
      <text x="600" y="168" font-size="20" font-weight="600" letter-spacing="10" fill="#8b949e" opacity="0">
        ◆ &#160;D A T A B A S E &#160;·&#160; D R I V E N&#160; ◆
        <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
      </text>
      <text x="600" y="230" font-size="58" font-weight="800" fill="url(#title)" filter="url(#glow)">
        DISTRIBUTED INVENTORY
      </text>
      <text x="600" y="282" font-size="30" font-weight="700" letter-spacing="7" fill="#e6edf3">
        &amp; ORDER CONSISTENCY SYSTEM
      </text>
      <text x="600" y="330" font-size="16" letter-spacing="2" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">
        no overselling · no phantom stock · no lies in the database
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.6s" fill="freeze"/>
      </text>
    </g>

    <!-- scan line -->
    <rect x="-300" y="0" width="300" height="400" fill="url(#scan)" opacity="0.18">
      <animate attributeName="x" from="-300" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="398" rx="20" fill="none" stroke="url(#title)" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>