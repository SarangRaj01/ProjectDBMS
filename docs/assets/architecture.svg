<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Request flow from client through Spring Boot to MySQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#150d28"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="rail" d="M110 150 H1090"/>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- rail -->
  <line x1="110" y1="150" x2="1090" y2="150" stroke="#30363d" stroke-width="3" stroke-dasharray="4 8"/>
  <line x1="110" y1="150" x2="1090" y2="150" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- packets -->
  <g filter="url(#glow)">
    <circle r="7" fill="#58a6ff">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
    </circle>
    <circle r="7" fill="#bc8cff">
      <animateMotion dur="5s" begin="1.6s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
    </circle>
    <circle r="7" fill="#3fb950">
      <animateMotion dur="5s" begin="3.3s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
    </circle>
  </g>

  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- node 1 -->
    <g filter="url(#glow)">
      <rect x="30" y="108" width="160" height="84" rx="16" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    </g>
    <text x="110" y="145" font-size="26">🌐</text>
    <text x="110" y="172" font-size="15" font-weight="700" fill="#58a6ff">Client</text>
    <text x="110" y="226" font-size="12" fill="#8b949e">Browser / HTTP</text>

    <!-- node 2 -->
    <g filter="url(#glow)">
      <rect x="250" y="108" width="160" height="84" rx="16" fill="#0d1117" stroke="#6DB33F" stroke-width="2"/>
    </g>
    <text x="330" y="145" font-size="26">🍃</text>
    <text x="330" y="172" font-size="15" font-weight="700" fill="#6DB33F">REST API</text>
    <text x="330" y="226" font-size="12" fill="#8b949e">Spring Boot</text>

    <!-- node 3 -->
    <g filter="url(#glow)">
      <rect x="470" y="108" width="160" height="84" rx="16" fill="#0d1117" stroke="#2ea043" stroke-width="2"/>
    </g>
    <text x="550" y="145" font-size="26">🎮</text>
    <text x="550" y="172" font-size="15" font-weight="700" fill="#3fb950">Controller</text>
    <text x="550" y="226" font-size="12" fill="#8b949e">ProductController</text>

    <!-- node 4 -->
    <g filter="url(#glow)">
      <rect x="690" y="108" width="160" height="84" rx="16" fill="#0d1117" stroke="#bc8cff" stroke-width="2"/>
    </g>
    <text x="770" y="145" font-size="26">📚</text>
    <text x="770" y="172" font-size="15" font-weight="700" fill="#bc8cff">Repository</text>
    <text x="770" y="226" font-size="12" fill="#8b949e">ProductRepository</text>

    <!-- node 5 -->
    <g filter="url(#glow)">
      <rect x="910" y="108" width="160" height="84" rx="16" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
    </g>
    <text x="990" y="145" font-size="26">🧩</text>
    <text x="990" y="172" font-size="15" font-weight="700" fill="#d29922">JPA / Hibernate</text>
    <text x="990" y="226" font-size="12" fill="#8b949e">ORM layer</text>

    <!-- db -->
    <g filter="url(#glow)">
      <rect x="1090" y="108" width="90" height="84" rx="16" fill="#0d1117" stroke="#4479A1" stroke-width="2"/>
    </g>
    <text x="1135" y="145" font-size="26">🐬</text>
    <text x="1135" y="172" font-size="15" font-weight="700" fill="#4479A1">MySQL</text>

    <text x="600" y="48" font-size="13" letter-spacing="6" fill="#8b949e" font-weight="600">REQUEST LIFECYCLE</text>
    <text x="600" y="76" font-size="20" font-weight="700" fill="#e6edf3">GET /api/products → JSON</text>
  </g>
</svg>