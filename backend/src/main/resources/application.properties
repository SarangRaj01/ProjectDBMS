spring.application.name=backend

# Automatically import local overrides (passwords, local ports) if file exists
spring.config.import=optional:classpath:application-local.properties

# Default MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false